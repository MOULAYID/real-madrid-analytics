name: Verify and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build portable dashboard data
        run: python scripts/build_static_dashboard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start public and Streamlit dashboards
        run: |
          python -m http.server 8080 --directory docs > public-server.log 2>&1 &
          PYTHONPATH="$GITHUB_WORKSPACE" python -m streamlit run dashboard/app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true --browser.gatherUsageStats false > streamlit-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ["http://127.0.0.1:8080/", "http://127.0.0.1:8501/_stcore/health"]:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError(f"Dashboard did not start: {url}")
          PY
      - name: Verify rendered dashboards
        run: node scripts/check_dashboard.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-review
          path: |
            docs/previews/
            public-server.log
            streamlit-server.log
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified dashboard
        id: deployment
        uses: actions/deploy-pages@v4
